# JEDNA DOSKA, test torque regulatora na skutocnom motore: sender so SIMULOVANYM motorom posiela
# uhol po localhost. Receiver so SKUTOCNYM motorom (config/board2_loopback_real.toml) bezi na tej
# istej doske a sleduje simulovany motor.
[network]
bind_ip = "127.0.0.1"
peer_ip = "127.0.0.1"
port = 5005

[motor]
backend = "sim"

[sender]
rate_hz = 200
initial_rpm = 0
max_rpm = 200                # pri torque_limit_a = 0.1 A motor ustali asi 270 rpm (trenie rastie s rychlostou); zvysuj spolu s limitom
ramp_rpm_s = 200             # pomala rampa ziadanej rychlosti pre prve pokusy
