# JEDNA DOSKA, test torque regulatora na skutocnom motore: receiver so SKUTOCNYM motorom sleduje
# simulovany sender (config/board1_loopback_sim.toml) cez localhost. Motor musi byt nezatazeny.
[network]
bind_ip = "127.0.0.1"
peer_ip = "127.0.0.1"
port = 5005

[motor]
backend = "foc_lib"
[motor.foc_lib]
module = "py_foc_motor_ctrl"
config_path = "config/anaheim_torque.config"  # moment startuje z 0 A, rampa knižnice nebrzdi regulator

[safety]
ka_rad_s2_per_a = 1177       # odmerane 29. 10. 2026, tools/measure_ka.py

[receiver]
rate_hz = 200
timeout_ms = 50
direction = 1                # ak sa motor tociv opacnom smere (kladne rpm), daj -1
ratio = 1.0
max_error_deg = 60
mode = "voltage_pd"          # kModeTorque tika po 0.5 s a nejde na polohovu regulaciu, pozri IMPROVMENTS.md
log_path = "receiver_log.csv"

[receiver.voltage_pd]
# Zosilnenia z namerane modelu motora (29. 10. 2026). Vystup je napatie [V]. Pre sender max 200 rpm
# treba asi 0.53 V (200 rpm / 450 rpm na V + 0.09 V mrtve pasmo), limit 0.8 V necha rezervu.
kp_v_per_deg = 0.028         # odladene 29. 10. 2026: 0.014/0.0005 -> RMS 2.69 deg, 0.020/0.0007 -> 1.91, 0.028/0.0010 -> 1.29
kd_v_per_dps = 0.0010
ki_v_per_deg_s = 0.05
kff_v_per_dps = 0.00037
i_limit_v = 0.3
voltage_limit_v = 0.8
slew_v_s = 100

[receiver.torque_pd]
# Krok 1 ladenia (PLAN.md 13.3): ki = 0, kp = 20 % vypocitaneho (0.0237 pre wn = 40 rad/s).
# kd = 0 sa neosvedcilo (29. 10. 2026): s nasytenim +-0.1 A sa polohova chyba rozkmitala az na FAULT.
# kd pre kp = 0.005, Ka = 1177 a tlmenie 0.8: 2 * 0.8 * sqrt(kp_rad * Ka) / Ka / 57.2958 = 0.00044.
kp_a_per_deg = 0.005
kd_a_per_dps = 0.00045
ki_a_per_deg_s = 0.0
i_limit_a = 0.05
torque_limit_a = 0.1         # prve pokusy len 0.1 A, motor volne otacatelny
slew_a_s = 20
