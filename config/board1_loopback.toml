# JEDNA DOSKA, test bez druhej dosky: sender so SKUTOCNYM motorom posiela uhol po localhost.
# Receiver s SIMULOVANYM motorom (config/board2_loopback_sim.toml) bezi na tej istej doske
# a ukazuje, ako by druhy motor sledoval prvy. Sietove oneskorenie tu nie je TSN.
[network]
bind_ip = "127.0.0.1"
peer_ip = "127.0.0.1"
port = 5005

[motor]
backend = "foc_lib"
[motor.foc_lib]
module = "py_foc_motor_ctrl"

[sender]
mode = "voltage_pi"          # vlastny regulator rychlosti cez napatie (4. 11. 2026), nie rezim Speed kniznice
rate_hz = 200
initial_rpm = 0
max_rpm = 500                # napatie je obmedzene na 1,5 V (asi 620 ot/min)
ramp_rpm_s = 500
log_path = "sender_log.csv"

[speed_pi]
cogging_table = "config/cogging_board2.csv"   # ten isty motor ako pri meraniach 4. 11. 2026
