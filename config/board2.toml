# DOSKA 2 = receiver (TSN slave). Sleduje uhol z dosky 1 vlastnym motorom.
[network]
bind_ip = "111.222.0.20"     # adresa na rozhrani ep.20 po "source /usr/bin/net_setup.sh -b2"
peer_ip = "111.222.0.10"
port = 5005

[motor]
backend = "foc_lib"          # pouziva motorovu kniznicu AMD
[motor.foc_lib]
module = "py_foc_motor_ctrl"  # py_foc_motor_ctrl (alebo prazdne "" pre autodetekciu)
config_path = "config/anaheim_torque.config"  # moment startuje z 0 A a rampa nebrzdi regulator (relativne k projektu)

[safety]
ka_rad_s2_per_a = 1177       # priemer 5 merani 29. 10. 2026 na doske 1 (1164 az 1192, trenie 22 az 32 rad/s^2), tools/measure_ka.py

[receiver]
rate_hz = 200
timeout_ms = 50
direction = 1                # ak sa motor 2 tociv opacnom smere, daj -1 (najprv s malym momentom!)
ratio = 1.0
max_error_deg = 60
mode = "voltage_pd"          # kModeTorque tika po 0.5 s a nejde na polohovu regulaciu, pozri IMPROVMENTS.md
log_path = "receiver_log.csv"

[receiver.voltage_pd]
# Odladene na doske 29. 10. 2026 (loopback, sender 50 / 100 / -100 rpm): RMS chyby 1.29 deg, max 9.1 deg.
# Vystup je napatie [V]; ustalene otacky su asi 450 rpm na V nad mrtvym pasmom 0.09 V, teda limit
# 1.0 V staci na asi 400 rpm. Pre rychlejsi sender zvys voltage_limit_v (stojaci motor odoberie asi 0.33 A na 1 V).
kp_v_per_deg = 0.028
kd_v_per_dps = 0.0010
ki_v_per_deg_s = 0.05
kff_v_per_dps = 0.00037
i_limit_v = 0.3
voltage_limit_v = 1.0
slew_v_s = 100

[receiver.torque_pd]
# Nepouziva sa (mode = "voltage_pd"). Startovacie hodnoty zo SIMULACIE, nie z realneho motora.
kp_a_per_deg = 0.011
kd_a_per_dps = 0.00045
ki_a_per_deg_s = 0.0
i_limit_a = 0.05
torque_limit_a = 0.1         # prve pokusy len 0.1 A, motor volne otacatelny
slew_a_s = 20
